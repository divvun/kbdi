[package]
name = "kbdi"
version = "0.5.1"
authors = []
license = "Apache-2.0 OR MIT"
publish = false
edition = "2024"
rust-version = "1.98.1"

[features]
legacy = []

[[bin]]
name = "kbdi-legacy"
required-features = ["legacy"]
doc = false
path = "src/bin/kbdi_legacy.rs"

[[bin]]
name = "kbdi"
required-features = []
doc = false
path = "src/bin/kbdi.rs"

[dependencies]
log = "0.4.34"
libloading = "0.9.0"
windows-registry = "0.100.0"
windows-result = "0.100.0"
fern = "0.7.1"
thiserror = "2.0.20"
chrono = "0.4.45"
indexmap = "2.14.2"
clap = { version = "4.6.6", features = ["derive"] }
windows-core = "0.100.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = true
debug = true
